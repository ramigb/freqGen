<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>freqGen</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Frequency Generator</h1>
      <p>Loop a tone, tweak the wave shape, and watch it dance.</p>
    </header>

    <section class="controls">
      <div class="control-block">
        <label for="frequency">Frequency (Hz)</label>
        <div class="inline-control">
          <input type="range" id="frequency" min="20" max="2000" value="440" />
          <input type="number" id="frequencyNumber" min="20" max="2000" value="440" />
        </div>
      </div>

      <div class="control-row">
        <div class="control-block">
          <label for="waveform">Waveform</label>
          <select id="waveform">
            <option value="sine">Sine</option>
            <option value="square">Square</option>
            <option value="sawtooth">Sawtooth</option>
            <option value="triangle">Triangle</option>
          </select>
        </div>

        <div class="control-block">
          <label for="visualization">Visualization</label>
          <select id="visualization">
            <option value="waveform">Waveform</option>
            <option value="spectrum">Spectrum Bars</option>
            <option value="radial">Radial Energy</option>
          </select>
        </div>

        <div class="control-block">
          <label for="volume">Volume</label>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.3" />
        </div>
      </div>

      <div class="actions">
        <button id="playPause" class="primary">Play</button>
        <button id="stop">Stop</button>
      </div>
    </section>

    <section class="visualizer">
      <canvas id="scope" width="800" height="360" aria-label="waveform visualization"></canvas>
    </section>
  </main>

  <footer>
    <small>Built with the Web Audio API · freqGen</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
